default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 3) %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: <%= ENV.fetch("ACME_DATABASE_PATH") {
    if ENV["RAILWAY_VOLUME_MOUNT_PATH"]
      File.join(ENV.fetch("RAILWAY_VOLUME_MOUNT_PATH"), "acme.sqlite3")
    else
      "storage/production.sqlite3"
    end
  }.to_json %>
